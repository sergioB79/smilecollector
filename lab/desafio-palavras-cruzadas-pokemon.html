<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Palavras Cruzadas Pokémon — Smilecollector</title>
<meta name="description" content="Achas que sabes mesmo de Pokémon? Então prova-o. Sem Googlar. Palavras Cruzadas Pokémon — nível iniciante, 15 × 15.">
<style>
:root{--navy:#0c2b58;--purple:#7658b6;--yellow:#ffbf16;--paper:#fffaf0;--red:#ef4747}
*{box-sizing:border-box}body{margin:0;background:#ece7db;font-family:Arial,Helvetica,sans-serif;color:var(--navy);padding:24px}
.wrap{max-width:1080px;margin:auto;background:var(--paper);min-height:1080px;position:relative;overflow:hidden;box-shadow:0 18px 50px #0002;background-image:radial-gradient(#7658b61c 1.5px,transparent 1.5px);background-size:22px 22px}
.inner{padding:40px 48px 112px;text-align:center;position:relative;z-index:2}
h1{font-size:clamp(44px,7vw,74px);line-height:.96;margin:0;font-weight:900;letter-spacing:-2px}.purple{color:var(--purple)}.yellow{color:var(--yellow);text-shadow:2px 2px 0 var(--navy)}
.challenge{display:inline-block;margin:24px auto 18px;background:var(--navy);color:white;padding:14px 42px;font-size:clamp(22px,3vw,34px);font-weight:900;transform:rotate(-.5deg);clip-path:polygon(2% 8%,98% 0,96% 90%,3% 100%)}.challenge b{color:var(--yellow)}
h2{font-size:clamp(26px,4vw,38px);margin:8px 0 12px;font-style:italic}.pill{display:inline-block;background:var(--purple);color:white;border-radius:999px;padding:8px 22px;font-size:21px;font-weight:800;margin-bottom:24px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:24px;align-items:end;max-width:850px;margin:0 auto}.paper{background:white;padding:24px;border-radius:8px;box-shadow:0 10px 24px #0002;transform:rotate(-.6deg)}
.grid{display:grid;grid-template-columns:repeat(15,1fr);aspect-ratio:1;background:#050505;border:1px solid #111}.cell{position:relative;background:#050505}.cell.open{background:#fff;border:.6px solid #222}.num{position:absolute;left:3px;top:2px;font-size:8px;font-weight:800;color:#111}
.side{display:flex;flex-direction:column;gap:16px;align-items:center}.qrbox{background:#fff;border:3px solid var(--purple);border-radius:18px;padding:12px;width:190px}.qrbox strong{display:block;font-size:23px;margin-bottom:9px}.qrbox img{width:154px;height:154px;display:block;margin:auto}.logo{width:145px;height:145px;object-fit:contain}
.pokeball{position:absolute;width:390px;height:390px;border-radius:50%;left:-225px;top:520px;background:linear-gradient(var(--red) 0 46%,var(--navy) 46% 56%,#fff 56%);border:16px solid var(--navy);z-index:1}.pokeball:after{content:"";position:absolute;width:82px;height:82px;border-radius:50%;background:#fff;border:16px solid var(--navy);left:138px;top:138px}.halo{position:absolute;width:430px;height:430px;border-radius:50%;left:-180px;top:500px;background:#ffd033;z-index:0}
.arrow{font-size:70px;color:#eaae00;line-height:.8;transform:rotate(12deg)}
.footer{position:absolute;left:0;right:0;bottom:0;height:80px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 46px;font-weight:700;font-size:20px;z-index:3}.footer b{color:var(--yellow)}.footer a{color:white;text-decoration:none;font-size:16px;font-weight:400}
.actions{max-width:1080px;margin:18px auto 0;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.actions a{background:var(--navy);color:#fff;text-decoration:none;padding:10px 15px;border-radius:7px;font-weight:700}.actions a.alt{background:#fff;color:var(--navy);border:2px solid var(--navy)}
@media(max-width:760px){body{padding:0}.wrap{min-height:auto;box-shadow:none}.inner{padding:28px 18px 104px}.main{grid-template-columns:1fr}.side{flex-direction:row;justify-content:center;flex-wrap:wrap}.pokeball,.halo{display:none}.footer{position:relative;height:auto;padding:18px;gap:8px;flex-direction:column}.paper{padding:12px}.num{font-size:6px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="halo"></div><div class="pokeball"></div>
  <div class="inner">
    <h1>Achas que sabes<br><span class="purple">mesmo de</span> <span class="yellow">Pokémon?</span></h1>
    <div class="challenge">Então prova-o. <b>Sem Googlar.</b></div>
    <h2>Palavras Cruzadas Pokémon</h2>
    <div class="pill">Nível iniciante • 15 × 15</div>
    <div class="main">
      <div class="paper"><div id="grid" class="grid" aria-label="Grelha de palavras cruzadas Pokémon"></div></div>
      <aside class="side">
        <div class="arrow">↘</div>
        <div class="qrbox"><strong>Explora aqui</strong><img alt="QR code Smilecollector" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&amp;data=https%3A%2F%2Fsergiob79.github.io%2Fsmilecollector%2F"></div>
        <img class="logo" src="../logo-smilecollector.png" alt="Smilecollector">
      </aside>
    </div>
  </div>
  <div class="footer"><span>Procura as respostas <b>no Lab.</b></span><a href="https://sergiob79.github.io/smilecollector/">sergiob79.github.io/smilecollector/</a></div>
</div>
<div class="actions"><a href="../lab.html">Abrir o Pokémon Lab</a><a class="alt" href="../index.html">Smilecollector</a></div>
<script>
const rows=[
'######.##.#####','###.##.....####','###.##.##.###.#','......#.....#..','.##.#####.###.#','.#...##.#.###.#','.####.#.##.##.#','.####......####','#####.#.##.##.#','####.##.##..#..','####....##.##.#','####.#####.##.#','####.#####.##.#','####........#.#','####.#.###.##.#'];
const nums={'0,6':1,'0,9':2,'1,3':3,'1,6':4,'2,13':5,'3,0':6,'3,7':7,'3,14':8,'5,2':9,'5,7':10,'6,5':11,'6,10':12,'7,5':13,'8,13':14,'9,4':15,'9,12':16,'10,4':17,'13,4':18,'13,6':19};
const grid=document.getElementById('grid');rows.forEach((row,r)=>[...row].forEach((ch,c)=>{const d=document.createElement('div');d.className='cell'+(ch==='.'?' open':'');const k=r+','+c;if(nums[k]){const n=document.createElement('span');n.className='num';n.textContent=nums[k];d.appendChild(n)}grid.appendChild(d)}));
</script>
</body></html>
