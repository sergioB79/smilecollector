name: Fix Ninovio image extension

on:
  push:
    paths:
      - '.github/workflows/fix-ninovio-extension.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point Lab to uploaded JPEG
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lab.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('assets/lab/ninovio-line.jpg','assets/lab/ninovio-line.jpeg')
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-ninovio-extension.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Ninovio image extension' || true
          git push
