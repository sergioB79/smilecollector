name: Fix Cresselia image path

on:
  push:
    paths:
      - '.github/workflows/rebuild-lab-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Point Cresselia page at the real JPG
        shell: bash
        run: |
          sed -i 's#../assets/lab/cresselia-why\.webp#../assets/lab/cresselia-why.jpg#g' lab/cresselia.html

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lab/cresselia.html

          if git diff --cached --quiet; then
            echo 'Cresselia path already correct.'
          else
            git commit -m 'Fix Cresselia image path'
            git push
          fi
