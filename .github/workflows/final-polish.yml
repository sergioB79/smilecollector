name: Final site polish

on:
  push:
    paths:
      - '.github/workflows/final-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean public copy and contacts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Missing expected text in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'index.html',
              '<p>Esta lista não está escrita à mão nesta página. A Home lê o arquivo central do Lab e mostra automaticamente os dossiers mais recentes. É menos romântico, mas evita esquecer links às três da manhã.</p>',
              '<p>As últimas coisas que saíram do Lab — por ordem de aparecimento, não necessariamente por ordem de bom senso.</p>'
          )

          replace_once(
              'index.html',
              '<p style="margin-top:2rem"><strong>Contacto directo:</strong> 📞 +351 910 407 585 &nbsp;·&nbsp; ✉️ sergiobatalha79@gmail.com</p>\n      <p><a href="https://www.cardmarket.com/en/Pokemon/Users/smilecollector" target="_blank" rel="noopener" style="color:var(--pink);font-weight:bold">Cardmarket: smilecollector ↗</a></p>',
              '<p style="margin-top:2rem"><strong>Contacto directo:</strong> ✉️ <a href="mailto:sergiobatalha79@gmail.com">sergiobatalha79@gmail.com</a></p>\n      <p><a href="https://www.instagram.com/smilecollector_pkm/" target="_blank" rel="noopener" style="color:var(--pink);font-weight:bold">Instagram: @smilecollector_pkm ↗</a> &nbsp;·&nbsp; <a href="https://www.cardmarket.com/en/Pokemon/Users/smilecollector" target="_blank" rel="noopener" style="color:var(--pink);font-weight:bold">Cardmarket: smilecollector ↗</a></p>'
          )

          replace_once(
              'lab.html',
              '    <div class="legend"><span class="badge verified">AUTO-INDEXED</span><span class="badge mixed">lab/articles.json</span></div>\n    <h2 style="font-family:var(--title);font-size:clamp(2rem,5vw,3rem);margin:.3rem 0 .7rem">DOSSIER ARCHIVE</h2>\n    <p>Os artigos longos já não vivem todos nesta bancada. Cada investigação tem o seu próprio ficheiro, com botão de regresso, fontes e espaço para ganhar um design ligeiramente diferente sem deixar de parecer parte do mesmo caderno.</p>\n    <p><strong>Adicionar um artigo novo:</strong> criar a página em <code>lab/</code> e acrescentar uma entrada a <code>lab/articles.json</code>. A Home e este arquivo tratam do resto.</p>',
              '    <h2 style="font-family:var(--title);font-size:clamp(2rem,5vw,3rem);margin:.3rem 0 .7rem">DOSSIER ARCHIVE</h2>\n    <p>Investigações recuperadas do Lab. Algumas começaram com uma entrada da Pokédex; outras com uma pergunta que devia ter ficado quieta.</p>'
          )
          PY

          # Remove obsolete one-off workflow used for the Cresselia image fix.
          rm -f .github/workflows/rebuild-lab-images.yml
          rm -f .github/workflows/final-polish.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Final copy polish and Instagram contact'
          git push
